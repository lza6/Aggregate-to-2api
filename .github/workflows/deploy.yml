name: Deploy

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx pytest-timeout pytest-benchmark
      - name: 运行测试
        # pytest-timeout 兜底：单个测试最长 120s，防网络类测试卡死 CI
        run: pytest tests/ -q -m "not integration and not chaos and not slow" --timeout=120 --cov=api --cov-report=term --cov-fail-under=70
        env:
          IF_ACCOUNT_AUTO: "0"
          IF_MOCK_REGISTER: "1"
          IF_DB_FILE: "data/test-deploy.db"

  build:
    name: 构建并推送 Docker 镜像到 GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建 API 镜像（缓存加速）
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aggregate-to-2api/imagefree-api:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/aggregate-to-2api/imagefree-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: SSH 热更新部署（零宕机）
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Node.js（构建前端）
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: 构建 frontend（管理面板）
        run: |
          cd frontend && npm ci && npm run build
      - name: 构建 landing（落地页）
        run: |
          cd landing && npm ci && npm run build
      # P0-2：tag 发版是版本一致性的最后一道闸。build 后立即断言 dist 里注入的
      # __APP_VERSION__ 与源码三处版本一致（防 build 产物漂移被静默带上线）。
      - name: 断言 landing dist 版本与源码一致
        run: |
          VERSION=$(node -p "require('./landing/package.json').version")
          echo "landing package.json version: $VERSION"
          grep -rl "$VERSION" landing/dist/assets/*.js >/dev/null && echo "OK: dist 已含版本 $VERSION" || { echo "FAIL: landing/dist/assets/*.js 未含版本 $VERSION（npm run build 未跑或 __APP_VERSION__ 注入失效）"; exit 1; }
      - name: 打包 dist 产物
        run: |
          tar -czf frontend-dist.tgz -C frontend/dist .
          tar -czf landing-dist.tgz -C landing/dist .
      - name: 上传 dist 到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "frontend-dist.tgz,landing-dist.tgz"
          target: "/tmp/"
          timeout: "60s"
      - name: SSH 拉新镜像 + 部署 dist + 热重启
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -e
            cd /home/ubuntu/imagefree-api

            # git pull 最新代码（Dockerfile/compose 等）
            sudo git fetch origin && sudo git reset --hard origin/main

            cd deploy

            # 拉取最新 API 镜像（GHCR）；失败则本地 build
            sudo docker pull ghcr.io/lza6/aggregate-to-2api/imagefree-api:latest 2>/dev/null && \
              export API_IMAGE="ghcr.io/lza6/aggregate-to-2api/imagefree-api:latest" || \
              { echo "GHCR 镜像拉取失败，本地 build"; export DOCKER_BUILDKIT=0; sudo docker build --no-cache -f Dockerfile.api -t imagefree-api:6.8.0 ..; }

            # cfsolver 镜像保险：compose 的 cfsolver 依赖 imagefree-cfsolver:6.8.0，
            # 若宿主机该镜像被清理而 cfsolver 容器需 recreate（如 git reset 换了 compose），
            # 会报 'No such image' 导致 compose up 失败。先本地 build 兜底（非 ghcr push）。
            sudo docker build -f Dockerfile.cfsolver -t imagefree-cfsolver:6.8.0 .. 2>/dev/null || \
              echo "cfsolver 镜像已存在或 build 失败（跳过，使用现有镜像）"

            # 部署前端 dist 产物
            mkdir -p ../frontend/dist ../landing/dist
            tar -xzf /tmp/frontend-dist.tgz -C ../frontend/dist
            tar -xzf /tmp/landing-dist.tgz -C ../landing/dist
            rm -f /tmp/frontend-dist.tgz /tmp/landing-dist.tgz

            # 热重启 API 容器（cfsolver 不动，只重建 api）
            export DOCKER_BUILDKIT=0
            sudo docker compose up -d --force-recreate --no-build api

            # 等待健康
            echo "等待 API 健康..."
            for i in $(seq 1 30); do
              if curl -s http://localhost:8100/v1/healthz | grep -q '"status":"ok"'; then
                echo "API 健康（第 ${i} 次检查）"
                break
              fi
              sleep 2
            done

            # 验证
            echo "=== 验证 ==="
            curl -s -o /dev/null -w "GET /admin -> %{http_code}\n" http://localhost:8100/admin
            curl -s -o /dev/null -w "GET /admin/ -> %{http_code}\n" http://localhost:8100/admin/
            curl -s -o /dev/null -w "GET / -> %{http_code}\n" http://localhost:8100/
            curl -s http://localhost:8100/v1/healthz | python3 -c "import sys,json;d=json.load(sys.stdin);print('status:',d['status'],'providers:',list(d['providers'].keys()))" 2>/dev/null || echo "healthz 解析失败"
            echo "部署完成"

  release:
    name: 创建发行版
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 生成发行版说明
        id: release_notes
        run: |
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "# imagefree-api ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "## 变更" >> $GITHUB_OUTPUT
          git log --oneline --no-decorate $(git tag --sort=-creatordate | head -2 | tail -1)..HEAD 2>/dev/null || \
            git log --oneline --no-decorate -20 >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.notes }}
          generate_release_notes: false
