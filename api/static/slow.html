<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>慢请求看板 - imagefree API</title>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1c23;
            --panel: #171a22;
            --border: #2a2d3a;
            --text: #e4e6f0;
            --text-secondary: #8a8fa8;
            --accent: #6c8cff;
            --warn: #f59e0b;
            --danger: #ef5350;
            --ok: #22c55e;
            --queue: #6c8cff;
            --wait-token: #a78bfa;
            --solve: #f59e0b;
            --upstream: #22c55e;
            --retry: #ef5350;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }
        .wrap { max-width: 1200px; margin: 0 auto; padding: 40px 24px 80px; }
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
        }
        h1 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent), #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        header .sub { color: var(--text-secondary); font-size: 0.85rem; margin-top: 4px; }
        header .actions { display: flex; align-items: center; gap: 12px; }
        .status-dot {
            display: inline-block;
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--text-secondary);
            margin-right: 6px;
        }
        .status-dot.ok { background: var(--ok); }
        .status-dot.err { background: var(--danger); }
        #auto-label { color: var(--text-secondary); font-size: 0.8rem; }
        button {
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 18px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: background 0.15s;
        }
        button:hover { background: var(--accent); filter: brightness(1.15); }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
            margin-bottom: 28px;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px 18px;
        }
        .card .label { color: var(--text-secondary); font-size: 0.8rem; margin-bottom: 6px; }
        .card .value { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
        .table-wrap {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 14px; text-align: left; font-size: 0.85rem; }
        thead th {
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }
        tbody tr { border-bottom: 1px solid var(--border); }
        tbody tr:last-child { border-bottom: none; }
        tbody tr:hover { background: var(--panel); }
        td.mono, .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-variant-numeric: tabular-nums; }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }
        .bar-cell { min-width: 260px; }
        .bar-track {
            display: flex;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.04);
            width: 100%;
        }
        .seg { height: 100%; min-width: 0; }
        .seg.queue { background: var(--queue); }
        .seg.wait_token { background: var(--wait-token); }
        .seg.solve { background: var(--solve); }
        .seg.submit { background: #38bdf8; }
        .seg.poll { background: #34d399; }
        .seg.upstream { background: var(--upstream); }
        .seg.retry { background: var(--retry); }
        .legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 14px 4px 4px; }
        .legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--text-secondary); }
        .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
        .empty, .error-msg {
            padding: 48px 20px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        .error-msg { color: var(--danger); }
        #updated-at { color: var(--text-secondary); font-size: 0.8rem; text-align: right; margin-top: 10px; }
        .task-id { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        .dash-link { font-size: 0.8rem; }
    </style>
</head>
<body>
<div class="wrap">
    <header>
        <div>
            <h1>慢请求看板</h1>
            <div class="sub">最近超过阈值（threshold_ms）的请求画像 · 定位慢在排队 / 取 token / 求解 / 上游</div>
        </div>
        <div class="actions">
            <span><span class="status-dot" id="status-dot"></span><span id="auto-label">每 15 秒自动刷新</span></span>
            <button id="refresh-btn" type="button">刷新</button>
        </div>
    </header>

    <section class="cards">
        <div class="card">
            <div class="label">慢请求数</div>
            <div class="value" id="stat-count">-</div>
        </div>
        <div class="card">
            <div class="label">平均耗时</div>
            <div class="value" id="stat-avg">-</div>
        </div>
        <div class="card">
            <div class="label">最慢阶段</div>
            <div class="value" id="stat-stage">-</div>
        </div>
        <div class="card">
            <div class="label">阈值 (ms)</div>
            <div class="value" id="stat-threshold">-</div>
        </div>
    </section>

    <div class="legend">
        <span><i class="seg queue"></i>排队 queue</span>
        <span><i class="seg wait_token"></i>取 token</span>
        <span><i class="seg solve"></i>求解 solve</span>
        <span><i class="seg submit"></i>上游首字节 submit</span>
        <span><i class="seg poll"></i>上游轮询 poll</span>
        <span><i class="seg upstream"></i>上游 upstream</span>
        <span><i class="seg retry"></i>重试 retry</span>
    </div>

    <div class="table-wrap">
        <div class="error-msg" id="error-msg" style="display:none">加载失败，请稍后重试</div>
        <table id="tbl" style="display:none">
            <colgroup>
                <col style="width:16%">
                <col style="width:12%">
                <col style="width:12%">
                <col style="width:44%">
                <col style="width:16%">
            </colgroup>
            <thead>
                <tr>
                    <th>任务 ID</th>
                    <th>总计</th>
                    <th>最慢阶段</th>
                    <th>各阶段耗时</th>
                    <th>状态</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
        <div class="empty" id="empty-state">暂无慢请求记录</div>
    </div>

    <div id="updated-at"></div>
    <p class="dash-link"><a href="/">返回 API 文档</a></p>
</div>

<script>
(function () {
    "use strict";
    var STAGES = [
        { key: "queue_ms", name: "queue" },
        { key: "wait_token_ms", name: "wait_token" },
        { key: "solve_ms", name: "solve" },
        { key: "upstream_ms", name: "upstream" },
        { key: "retry_ms", name: "retry" }
    ];
    var STAGE_LABEL = { queue: "排队", wait_token: "取token", solve: "求解", upstream: "上游", retry: "重试" };
    var tbody = document.getElementById("tbody");
    var tbl = document.getElementById("tbl");
    var emptyState = document.getElementById("empty-state");
    var errorMsg = document.getElementById("error-msg");
    var dot = document.getElementById("status-dot");

    function fmt(ms) {
        if (ms === null || ms === undefined || isNaN(ms)) return "-";
        if (ms < 1000) return Math.round(ms) + "ms";
        return (ms / 1000).toFixed(2) + "s";
    }

    function esc(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
    }

    function render(data) {
        var stats = data.stats || {};
        document.getElementById("stat-count").textContent = String(data.count);
        document.getElementById("stat-avg").textContent = fmt(stats.avg_total_ms);
        document.getElementById("stat-stage").textContent = stats.slowest_stage ? (STAGE_LABEL[stats.slowest_stage] || stats.slowest_stage) : "-";
        document.getElementById("stat-threshold").textContent = String(data.threshold_ms);
        tbody.innerHTML = "";
        var items = data.items || [];
        if (items.length === 0) {
            tbl.style.display = "none";
            emptyState.style.display = "";
            return;
        }
        emptyState.style.display = "none";
        tbl.style.display = "";
        items.forEach(function (it) {
            var parts = [];
            var fracs = {};
            var total = it.total_ms || 0;
            STAGES.forEach(function (s) {
                var v = (typeof it[s.key] === "number") ? it[s.key] : 0;
                if (v <= 0) return;
                var f = total > 0 ? (v / total) : 0;
                fracs[s.name] = f;
                parts.push('<span class="seg ' + s.name + '" style="width:' + (Math.max(f * 100, 0.6)) + '%" title="' + esc(STAGE_LABEL[s.name]) + ' ' + fmt(v) + '"></span>');
            });
            var bar = parts.length ? '<div class="bar-track">' + parts.join("") + '</div>' : '<div class="bar-track"></div>';
            var slow = it.slowest_stage || "-";
            var tr = document.createElement("tr");
            tr.innerHTML =
                '<td class="mono task-id" title="' + esc(it.task_id || "") + '">' + esc(it.task_id) + '</td>' +
                '<td class="mono"><b>' + fmt(it.total_ms) + '</b></td>' +
                '<td>' + esc(STAGE_LABEL[slow] || slow) + '</td>' +
                '<td class="bar-cell">' + bar + '</td>' +
                '<td>' + '<span class="badge">' + esc(it.status || "") + '</span>' + '</td>';
            tbody.appendChild(tr);
        });
    }

    function load() {
        fetch("/v1/slow").then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.json();
        }).then(function (data) {
            render(data);
            errorMsg.style.display = "none";
            dot.className = "status-dot ok";
            document.getElementById("updated-at").textContent = "更新于 " + new Date().toLocaleTimeString();
        }).catch(function (e) {
            tbl.style.display = "none";
            emptyState.style.display = "none";
            errorMsg.style.display = "";
            dot.className = "status-dot err";
            void e;
        });
    }

    document.getElementById("refresh-btn").addEventListener("click", load);
    load();
    setInterval(load, 15000);
})();
</script>
</body>
</html>
