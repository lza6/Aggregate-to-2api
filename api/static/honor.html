<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>支持听风AI · 请我喝咖啡</title>
<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --border: #334155;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --accent: #f59e0b;
  --accent-rgb: 245, 158, 11;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  line-height: 1.6;
}
.container {
  max-width: 560px;
  margin: 0 auto;
  padding: 40px 20px 60px;
  text-align: center;
}
.back-link {
  display: inline-block;
  margin-bottom: 24px;
  color: var(--muted);
  text-decoration: none;
  font-size: 14px;
  transition: color .2s;
}
.back-link:hover { color: var(--text); }
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 36px 28px;
  box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
}
.avatar-wrap {
  width: 72px; height: 72px;
  margin: 0 auto 16px;
  border-radius: 50%;
  background: rgba(var(--accent-rgb), 0.15);
  display: flex; align-items: center; justify-content: center;
  font-size: 36px;
}
h1 {
  font-size: 24px;
  margin: 0 0 12px;
  font-weight: 600;
  color: var(--text);
}
.tag {
  display: inline-block;
  font-size: 12px;
  padding: 2px 10px;
  border-radius: 12px;
  background: rgba(var(--accent-rgb), 0.15);
  color: var(--accent);
  margin-bottom: 18px;
}
.desc {
  color: var(--muted);
  font-size: 14px;
  text-align: left;
  line-height: 1.75;
  margin: 0 0 28px;
  padding: 16px;
  background: rgba(15, 23, 42, 0.6);
  border-radius: 8px;
  border-left: 3px solid var(--accent);
}
.qr-box {
  background: #ffffff;
  padding: 16px;
  border-radius: 12px;
  display: inline-block;
  margin: 0 auto 20px;
  box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
}
.qr-img {
  width: 240px;
  height: 240px;
  display: block;
  object-fit: cover;
  border-radius: 4px;
}
.qr-hint {
  font-size: 13px;
  color: var(--muted);
  margin: 0 0 24px;
}
.meta-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  font-size: 13px;
  text-align: left;
}
.meta-item {
  color: var(--muted);
}
.meta-item b {
  color: var(--text);
  display: block;
  font-weight: 500;
}
.meta-item a {
  color: var(--accent);
  text-decoration: none;
}
.footer-note {
  margin-top: 28px;
  font-size: 12px;
  color: #64748b;
}
</style>
</head>
<body>
<div class="container">
  <a href="/" class="back-link">← 返回听风AI首页</a>

  <div class="card">
    <div class="avatar-wrap">☕</div>
    <h1>支持听风AI</h1>
    <div class="tag">公益运行 · 开放接口 · 持续维护</div>

    <div class="desc">
      听风AI（逆向号池）是一个由个人全资维护的 AI 图像生成网关，整合多家上游逆向接口，向社区提供免费、零鉴权的统一调用能力。
      <br><br>
      服务器（腾讯云东京）、住宅代理流量与 Turnstile 求解器每天都在持续产生成本。如果这个项目对你的开发、学习或业务有所帮助，欢迎扫码请我喝杯咖啡，支持服务更稳定地运转下去！
    </div>

    <div class="qr-box">
      <img class="qr-img" src="/static/zanshang.jpg" alt="微信赞赏码" onerror="this.parentElement.innerHTML='<div style=\'color:#ef4444;padding:40px 10px;width:240px\'>赞赏码图片加载中...</div>'">
    </div>

    <p class="qr-hint">微信扫一扫 · 赞赏支持</p>

    <div class="meta-grid">
      <div class="meta-item">
        微信联系
        <b>Tf00798</b>
      </div>
      <div class="meta-item">
        开源地址
        <b><a href="https://github.com/lza6/Image-to-2api" target="_blank" rel="noopener">github.com/lza6</a></b>
      </div>
    </div>
  </div>

  <p class="footer-note">感谢每一位赞赏与支持的小伙伴 · 每一分心意都是维护项目的动力</p>
</div>
</body>
</html>
