# imagefree_api 部署编排 — 生产级配置
# 服务：cfsolver(8001, 内部) + api(8100, 公网)
# 版本: v6.3.0
# 注意：docker-compose 需从 deploy/ 目录运行（build context: . 指向 deploy/）

services:
  cfsolver:
    build:
      context: .
      dockerfile: Dockerfile.cfsolver
    image: imagefree-cfsolver:latest
    container_name: imagefree-cfsolver
    restart: unless-stopped
    mem_limit: 1024m
    mem_reservation: 1g
    cpus: '2'
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1',8001),timeout=2).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # 不暴露公网端口，仅 compose 内部网络供 api 访问
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - imagefree

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: imagefree-api:latest
    container_name: imagefree-api
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m
    cpus: '1'
    depends_on:
      cfsolver:
        condition: service_healthy
    ports:
      - "8100:8100"
    volumes:
      - ./data:/app/data
      # 管理面板前端产物（宿主机构建 dist → 只读挂载；后端 /admin 静态出）
      - ../frontend/dist:/app/frontend/dist:ro
    environment:
      - IF_CF_SOLVER_URL=http://cfsolver:8001
      - IF_HOST=0.0.0.0
      - IF_PORT=8100
      - IF_BASE_URL=https://imagefree.net
      - IF_SITEKEY=0x4AAAAAACE-XLGoQUckKKm_
      # 免费代理池（aifreeforever 每 IP 每日限额必须）
      - IF_FREE_PROXY=1
      - IF_FREE_PROXY_REFRESH_MIN=10
      # 服务器直连，显式清空代理
      - IF_PROXY=
      - HTTP_PROXY=
      - HTTPS_PROXY=
      - NO_PROXY=*
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, json; r = urllib.request.urlopen('http://127.0.0.1:8100/v1/healthz', timeout=5); body = json.loads(r.read()); assert body.get('status') in ('ok','degraded')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - imagefree

networks:
  imagefree:
    name: imagefree-network
    driver: bridge