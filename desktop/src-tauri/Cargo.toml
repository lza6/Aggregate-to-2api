[package]
name = "tingfeng-desktop"
version = "20.3.5"
description = "听风AI 智能体工作台桌面版（Tauri 2.x + React19 管理面板）"
edition = "2021"

[lib]
name = "tingfeng_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
# P1-11：系统通知（任务完成）——v13.1.1 已装 config/capability，本轮补 Rust 注册
tauri-plugin-notification = "2"
# P1-11：应用自升级（GitHub Release 静态 URL + 签名校验）
tauri-plugin-updater = "2"
# P1-7：全局快捷键 Ctrl+Shift+T 唤起主窗（tauri 已有 tray-icon feature，叠加即可）
tauri-plugin-global-shortcut = "2"
# P1-7：开机自启（托盘菜单 toggle）
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# sidecar 托管后端：spawn 子进程 + 健康探测（仅 Windows 需要，纯 std）
# 不引入 tokio——Tauri 自带 async runtime；子进程管理用 std::process + 后台线程轮询。

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Threading"] }
