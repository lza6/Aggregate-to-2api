<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover：刘海屏/异形屏安全区由 env(safe-area-inset-*) 兜底；
       用户可缩放保留（无障碍：视力障碍用户需放大）-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- theme-color：浏览器 UI（移动地址栏）跟随主题色，明/暗双态 -->
  <meta name="theme-color" content="#090d16" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="听风AI 管理中心 — 多提供商 AI 图像/对话生成网关控制台" />
  <!-- 字体非阻塞加载：preconnect 握手 + preload 指示 + media=print→all 切换 + font-display:swap。
       不再阻塞首屏渲染；字体未就绪时降级系统字体，LCP 不受拖累。 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"></noscript>
  <title>听风AI · 管理中心</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
